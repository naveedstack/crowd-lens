databases:
  - name: crowdlens-pg
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: crowdlens-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crowdlens-pg
          property: connectionString
      - key: PORT
        value: 8080
      - key: RPC_URL
        value: https://api.devnet.solana.com
      - key: LAMPORTS_PER_VOTE
        value: "1000000"
      - key: TASK_BATCH_SIZES
        value: "1,5,20,50,100"
      - key: JWT_SECRET
        sync: false
      - key: WORKER_JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: WALLET_MIN_SIGNATURES
        value: "1"
      - key: SETTLEMENT_MODE
        value: custodial
      - key: CROWDLENS_PROGRAM_ID
        value: "4DcAdpaXFFvzLVDxjHoswyKojaueMuQBF4cMTY4XNfw4"
      - key: TREASURY_ADDRESS
        sync: false
      - key: TREASURY_SECRET_KEY
        sync: false
